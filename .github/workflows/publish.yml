name: Publish XunLib

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: xunlib-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew


      - name: Verify version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          minecraft_version="$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2- | tr -d '\r')"
          mod_version="$(grep '^version=' gradle.properties | cut -d'=' -f2- | tr -d '\r')"
          release_version="${minecraft_version}-${mod_version}"

          echo "Minecraft version: $minecraft_version"
          echo "Mod version:       $mod_version"
          echo "Release version:   $release_version"
          echo "Release tag:       $RELEASE_TAG"

          if [[ "$RELEASE_TAG" != "$release_version" ]]; then
            echo "ERROR: Release tag does not match the project versions."
            echo "Expected tag: $release_version"
            exit 1
          fi

          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Publish Fabric
        uses: Kir-Antipov/mc-publish@v3.3.1
        with:
          modrinth-id: Y91RXtkK
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: |
            fabric/build/libs/!(*-@(dev|sources|javadoc)).jar
            fabric/build/libs/*-@(sources|javadoc).jar

          curseforge-id: 1245630
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: |
            fabric/build/libs/!(*-@(dev|sources|javadoc)).jar
            fabric/build/libs/*-@(sources|javadoc).jar

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ steps.version.outputs.tag }}
          github-version: ${{ steps.version.outputs.version }}
          github-files: |
            fabric/build/libs/!(*-@(dev|sources|javadoc)).jar
            fabric/build/libs/*-@(sources|javadoc).jar

          loaders: fabric
          game-versions: 1.21.1
          environment: client | server

          name: XunLib ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          modrinth-version: ${{ steps.version.outputs.version }}+fabric
          curseforge-version: ${{ steps.version.outputs.version }}+fabric
          version-type: release
          changelog-file: release-changelog.md

      - name: Publish NeoForge
        uses: Kir-Antipov/mc-publish@v3.3.1
        with:
          modrinth-id: Y91RXtkK
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: |
            neoforge/build/libs/!(*-@(dev|sources|javadoc)).jar
            neoforge/build/libs/*-@(sources|javadoc).jar

          curseforge-id: 1245630
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: |
            neoforge/build/libs/!(*-@(dev|sources|javadoc)).jar
            neoforge/build/libs/*-@(sources|javadoc).jar

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ steps.version.outputs.tag }}
          github-version: ${{ steps.version.outputs.version }}
          github-files: |
            neoforge/build/libs/!(*-@(dev|sources|javadoc)).jar
            neoforge/build/libs/*-@(sources|javadoc).jar

          loaders: neoforge
          game-versions: 1.21.1
          environment: client | server

          name: XunLib ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          modrinth-version: ${{ steps.version.outputs.version }}+neoforge
          curseforge-version: ${{ steps.version.outputs.version }}+neoforge
          version-type: release
          changelog-file: release-changelog.md