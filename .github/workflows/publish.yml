name: Publish XunLib

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (e.g. v3.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: xunlib-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Verify version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          project_version="$(grep '^version=' gradle.properties | cut -d'=' -f2- | tr -d '\r')"
          tag_version="${RELEASE_TAG#v}"

          echo "Gradle version: $project_version"
          echo "Release tag:    $RELEASE_TAG"
          echo "Release version: $tag_version"
          
          if [[ "$project_version" != "$tag_version" ]]; then
            echo "ERROR: Release tag and gradle.properties version do not match."
            echo "Expected tag: v${project_version}"
            exit 1
          fi
          
          echo "version=$project_version" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Publish Fabric
        uses: Kir-Antipov/mc-publish@v3.3.1
        with:
          modrinth-id: Y91RXtkK
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: |
            fabric/build/libs/!(*-@(dev|sources|javadoc)).jar

          curseforge-id: 1245630
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: |
            fabric/build/libs/!(*-@(dev|sources|javadoc)).jar

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ steps.version.outputs.tag }}
          github-files: |
            fabric/build/libs/!(*-@(dev|sources|javadoc)).jar
            fabric/build/libs/*-@(sources|javadoc).jar

          loaders: fabric
          game-versions: 1.21.1
          environment: client | server

          name: XunLib ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: release
          changelog-file: release-changelog.md

      - name: Publish NeoForge
        uses: Kir-Antipov/mc-publish@v3.3.1
        with:
          modrinth-id: Y91RXtkK
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: |
            neoforge/build/libs/!(*-@(dev|sources|javadoc)).jar

          curseforge-id: 1245630
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: |
            neoforge/build/libs/!(*-@(dev|sources|javadoc)).jar

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ steps.version.outputs.tag }}
          github-files: |
            neoforge/build/libs/!(*-@(dev|sources|javadoc)).jar
            neoforge/build/libs/*-@(sources|javadoc).jar

          loaders: neoforge
          game-versions: 1.21.1
          environment: client | server

          name: XunLib ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: release
          changelog-file: release-changelog.md